name: Refresh prices

# 04:30 Israel time, after the chains have published the night's files.
# Cron is UTC, and Israel is UTC+3 in summer and UTC+2 in winter, so the local
# hour drifts by one across the year — harmless for a nightly refresh.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# Shares its group with the code deploy: both publish the same site, and two
# publishes racing each other would leave whichever finished last. Never
# cancelled — a push arriving mid-refresh waits its turn rather than throwing
# away forty minutes of downloads.
concurrency:
  group: pages
  cancel-in-progress: false

# The catalogue is not committed: this job builds it and publishes the site
# with it directly. That fixed the stale prices — a push made with
# GITHUB_TOKEN never triggers another workflow, so the catalogue the bot used
# to commit never reached the site at all.
#
# What is committed is one small file, PRICES.md, in the owner's name, as the
# record that the night's update happened (the last step). `contents: write`
# is for that commit alone.
permissions:
  contents: write
  pages: write
  id-token: write
  # So a failed night can raise an issue against the repository instead of
  # relying on an email nobody opens.
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Nine portals, four cities, several hundred megabytes of XML. A normal
    # run is well inside this; the cap is here so a hung portal cannot burn
    # the whole job allowance.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      # Before the browser download, not after it. The tests need the packages
      # above, but they do not need Chrome — and putting them first means a
      # broken build costs seconds instead of a hundred megabytes.
      - name: Check the bot still parses correctly
        working-directory: bot
        run: npm test

      - name: Install Chrome for Puppeteer
        working-directory: bot
        run: npx puppeteer browsers install chrome

      # The bot is fail-soft by design: a chain that will not answer is logged
      # and skipped, and the other chains still produce a catalogue.
      - name: Build the catalogues
        working-directory: bot
        run: node src/index.js --catalog ../public --cities "תל אביב,ראשון לציון,חיפה,ירושלים"

      # Which is exactly why this step exists. Fail-soft plus an automatic
      # publish would quietly ship a two-chain catalogue on a night when five
      # portals were down. The baseline is what the live site serves right now
      # — what shoppers are actually looking at — not an old commit.
      - name: Refuse to publish a degraded catalogue
        run: |
          node bot/src/pull-live-catalog.js --index-only /tmp/published-index.json
          node bot/src/verify-catalog.js /tmp/published-index.json public/price-catalog-index.json

      # The same checks a code push goes through: a site that fails its own
      # tests is not published, whatever the prices say.
      - name: Install site dependencies
        run: npm ci

      - name: Test the site
        run: npm test

      - name: Build the site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      # One small commit a night, in the owner's name, so the repository shows
      # every update — and only the owner in its contributors. The commit
      # touches PRICES.md alone: a few lines, overwritten each night, instead
      # of the tens of megabytes of catalogue the bot used to commit.
      #
      # It is made on top of whatever main is now, not the commit this run
      # started from, so a push made during the forty-minute refresh is never
      # overwritten; if main moves again before the push lands, it retries.
      - name: Record the update
        env:
          GIT_AUTHOR_NAME: Oshri Magnezi
          GIT_AUTHOR_EMAIL: oshrimagen0@gmail.com
          GIT_COMMITTER_NAME: Oshri Magnezi
          GIT_COMMITTER_EMAIL: oshrimagen0@gmail.com
        run: |
          day=$(TZ=Asia/Jerusalem date +%d.%m.%Y)
          for attempt in 1 2 3; do
            git fetch --quiet --depth=1 origin main
            git checkout --quiet -B record-update FETCH_HEAD
            node bot/src/record-update.js public PRICES.md
            git add PRICES.md
            if git diff --cached --quiet; then
              echo "PRICES.md is unchanged; nothing to record."
              exit 0
            fi
            git commit --quiet -m "Update prices — $day"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the push; trying again."
            sleep 5
          done
          exit 1

      # This job ran and failed nineteen nights in a row without anyone
      # noticing, because the only signal was a notification email. An open
      # issue sits in the repository until it is dealt with, and it is the
      # first thing visible on the repo's front page.
      #
      # One issue, not one per night: if the alarm is already raised, a
      # twentieth copy of it says nothing new.
      - name: Raise an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly price refresh is failing'
          open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for this; not filing another."
            exit 0
          fi
          gh issue create --title "$title" --body "The scheduled price refresh failed and the published catalogue was left unchanged.

          Run: $RUN_URL

          Prices on the site stay as they are until this is fixed. Close this issue once a run succeeds."
