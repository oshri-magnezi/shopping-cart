name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as the nightly price refresh, which publishes the same site. Not
# cancelled in progress: cancelling here would also be able to cancel a
# refresh half-way through its downloads.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The catalogue is not in git any more — the nightly refresh publishes it
      # to the site directly. Without this a code push would rebuild the site
      # with no prices, or with whatever stale copy was on disk, and roll every
      # price back. The script only ever moves forward: a local copy newer than
      # the live one is kept. With neither, it fails the deploy rather than
      # shipping a comparison page with nothing to compare.
      - name: Bring in the live price catalogue
        run: node bot/src/pull-live-catalog.js public

      - run: npm ci

      # A failing test stops the deploy. The bug that made every hand-typed
      # item read "not found" at every chain shipped because nothing checked.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
